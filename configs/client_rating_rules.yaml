rating_window_days: 180
min_full_confidence_snapshot_days: 180

ratings:
  5:
    label: "Отличная дисциплина"
    max_overdue_occurrence_ratio: 0.00
    max_avg_overdue_share_pct: 0
    max_max_days_overdue: 0

  4:
    label: "Надежный клиент"
    max_overdue_occurrence_ratio: 0.10
    max_avg_overdue_share_pct: 5
    max_max_days_overdue: 3

  3:
    label: "Под контролем"
    max_overdue_occurrence_ratio: 0.25
    max_avg_overdue_share_pct: 15
    max_max_days_overdue: 10

  2:
    label: "Риск"
    max_overdue_occurrence_ratio: 0.50
    max_avg_overdue_share_pct: 35
    max_max_days_overdue: 30

  1:
    label: "Высокий риск"

severity_model:
  enabled: true

  exposure_segments:
    small:
      max_total_debt: 500000
      max_weighted_payment_term_days: 30
      multiplier: 0.5

    medium:
      max_total_debt: 2000000
      max_weighted_payment_term_days: 60
      multiplier: 1.0

    large:
      multiplier: 1.5

  payment_term_quality:
    weighted_avg_payment_term_days:
      - threshold: 45
        severity_points: 1
      - threshold: 60
        severity_points: 2
      - threshold: 90
        severity_points: 3

    max_payment_term_days:
      - threshold: 90
        severity_points: 1
      - threshold: 120
        severity_points: 2

    green_90_plus_share_pct:
      - threshold: 10
        severity_points: 1
      - threshold: 25
        severity_points: 2
      - threshold: 50
        severity_points: 3

    green_120_plus_debt:
      - threshold: 1
        severity_points: 2

  term_shift_behavior:
    term_shift_count:
      - threshold: 2
        severity_points: 1
      - threshold: 4
        severity_points: 2
      - threshold: 6
        severity_points: 3

  penalty_mapping:
    - min_severity_points: 0
      penalty: 0
    - min_severity_points: 2
      penalty: 0.5
    - min_severity_points: 4
      penalty: 1
    - min_severity_points: 6
      penalty: 2

  final_rating:
    min_stars: 1
    max_stars: 5
    rounding: floor